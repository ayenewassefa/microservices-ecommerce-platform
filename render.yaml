services:
  - type: web
    name: keycloak
    env: docker
    dockerfilePath: ./Dockerfile-keycloak
    dockerContext: .
    envVars:
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        value: admin
      - key: KC_DB
        value: dev-file
    ports:
      - port: 8080

  - type: web
    name: discovery-server
    env: docker
    dockerfilePath: ./discoveryServer/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
    ports:
      - port: 8761

  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: ./api-getway/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: KEYCLOAK_URL
        value: http://keycloak:8080/realms/spring-boot-microservices-realm   # port 8080, not 8181
    ports:
      - port: 8080

  - type: web
    name: product-service
    env: docker
    dockerfilePath: ./productService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_DATA_MONGODB_URI
        value: ${MONGO_URI}
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: ${KAFKA_BOOTSTRAP}
      - key: KEYCLOAK_URL
        value: http://keycloak:8080/realms/spring-boot-microservices-realm
    ports:
      - port: 8081

  - type: web
    name: order-service
    env: docker
    dockerfilePath: ./orderService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_DATASOURCE_URL
        value: ${MYSQL_URL}
      - key: SPRING_DATASOURCE_USERNAME
        value: ${MYSQL_USER}
      - key: SPRING_DATASOURCE_PASSWORD
        value: ${MYSQL_PASSWORD}
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: ${KAFKA_BOOTSTRAP}
      - key: KEYCLOAK_URL
        value: http://keycloak:8080/realms/spring-boot-microservices-realm
    ports:
      - port: 8082

  - type: web
    name: inventory-service
    env: docker
    dockerfilePath: ./inventoryService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_DATA_MONGODB_URI
        value: ${MONGO_URI}
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: ${KAFKA_BOOTSTRAP}
    ports:
      - port: 8083

  - type: web
    name: notification-service
    env: docker
    dockerfilePath: ./notificationService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: ${KAFKA_BOOTSTRAP}

  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://api-gateway.onrender.com
    ports:
      - port: 80