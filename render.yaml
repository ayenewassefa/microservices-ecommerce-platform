services:
  - type: web
    name: keycloak
    env: docker
    dockerfilePath: ./Dockerfile-keycloak
    dockerContext: .
    envVars:
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        value: admin
      - key: KC_DB
        value: dev-file
    ports:
      - port: 8080
        hostPort: 8181

  - type: web
    name: discovery-server
    env: docker
    dockerfilePath: ./discoveryServer/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/   # internal service name
    ports:
      - port: 8761


  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: ./api-getway/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: KEYCLOAK_URL
        value: http://keycloak:8181/realms/spring-boot-microservices-realm   # internal Keycloak URL
    ports:
      - port: 8080

  - type: web
    name: product-service
    env: docker
    dockerfilePath: ./productService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_DATA_MONGODB_URI
        value: mongodb://<your-mongodb-atlas-uri>/product_db   # replace with your Atlas URI
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: <your-confluent-cloud-bootstrap-server>
      - key: KEYCLOAK_URL
        value: http://keycloak:8181/realms/spring-boot-microservices-realm
    ports:
      - port: 8081

  - type: web
    name: order-service
    env: docker
    dockerfilePath: ./orderService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://<your-aiven-mysql-host>/order_db?useSSL=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: <your-mysql-username>
      - key: SPRING_DATASOURCE_PASSWORD
        value: <your-mysql-password>
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: <your-confluent-cloud-bootstrap-server>
      - key: KEYCLOAK_URL
        value: http://keycloak:8181/realms/spring-boot-microservices-realm
    ports:
      - port: 8082

  - type: web
    name: inventory-service
    env: docker
    dockerfilePath: ./inventoryService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_DATA_MONGODB_URI
        value: mongodb://<your-mongodb-atlas-uri>/inventory_db
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: <your-confluent-cloud-bootstrap-server>
    ports:
      - port: 8083

  - type: web
    name: notification-service
    env: docker
    dockerfilePath: ./notificationService/Dockerfile
    dockerContext: .
    envVars:
      - key: EUREKA_URL
        value: http://discovery-server:8761/eureka/
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: <your-confluent-cloud-bootstrap-server>

  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://api-gateway.onrender.com
    ports:
      - port: 80