services:
  # Discovery Server
  discovery-server:
    build:
      context: .
      dockerfile: ./discoveryServer/Dockerfile
    ports:
      - "8761:8761"
    environment:
      - EUREKA_URL=http://eureka:password@discovery-server:8761/eureka/
      - SPRING_SECURITY_BASIC_ENABLED=false   # ✅ disable security

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./api-getway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - product-service
      - order-service
      - inventory-service
    environment:
      - EUREKA_URL=http://eureka:password@discovery-server:8761/eureka/

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: ./productService/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - discovery-server
      - mongodb
      - kafka
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/product_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URL=http://eureka:password@discovery-server:8761/eureka/

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: ./orderService/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - discovery-server
      - mysql
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/order_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URL=http://eureka:password@discovery-server:8761/eureka/

  # Inventory Service
  inventory-service:
    build:
      context: .
      dockerfile: ./inventoryService/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - discovery-server
      - mongodb
      - kafka
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/inventory_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URL=http://eureka:password@discovery-server:8761/eureka/

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: ./notificationService/Dockerfile
    depends_on:
      - kafka
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URL=http://eureka:password@discovery-server:8761/eureka/

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

  # Databases
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=order_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Zookeeper & Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_PROCESS_ROLES=broker
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092

volumes:
  mongo_data:
  mysql_data: