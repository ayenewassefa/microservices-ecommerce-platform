spring.application.name=discoveryServer
server.port=8761

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Tell the server exactly how to reach "itself" with the password
eureka.client.service-url.defaultZone=http://eureka:password@127.0.0.1:8761/eureka/

# Disable the attempt to help other nodes (since there are no other nodes)
eureka.server.enable-self-preservation=false
# 1. Tell Eureka not to look for peers (other servers)

# 2. Set the service URL to itself so it stops searching
# 1. Tell the server NOT to act like a client (don't register with itself)

# 2. Tell the server NOT to try and sync data with other nodes

# 3. Increase the timeout so it stops complaining (optional)
eureka.server.peer-node-read-timeout-ms=5000

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
