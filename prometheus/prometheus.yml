global:
  scrape_interval: 10s # How often to check the services

scrape_configs:
  - job_name: 'spring-boot-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'product-service:8081'
          - 'order-service:8082'
          - 'inventory-service:8083'
          - 'notification-service:8086'