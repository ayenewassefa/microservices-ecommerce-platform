# application.properties - Product Service (For Local Development)
spring.application.name=product-service
server.port=8081

# ? Use localhost for local development
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/product_db}

# Eureka (Use localhost for local development)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:password@localhost:8761/eureka/}

# Zipkin
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.zipkin.tracing.export.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-boot-microservices-realm